[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenvision-studio"
version = "0.2.1"
description = "Drive the ASUS ZenVision OLED lid panel with live applets and custom animations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Igor Kochanski" }]
keywords = ["asus", "zenbook", "zenvision", "oled", "usb", "applets", "linux"]
classifiers = [
  "Environment :: No Input/Output (Daemon)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
  "pyusb>=1.2",
  "pillow>=9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "dbus-next>=0.2.3",
  "numpy>=1.23",   # frame encoder + spectrum analyser (parec is a system dep)
]

[project.optional-dependencies]
video = ["imageio[ffmpeg]>=2.30"]
tray = ["pystray>=0.19", "pillow>=9"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
zvstudio = "zvstudio.cli:main"
zvstudio-daemon = "zvstudio.cli:main"

[project.urls]
Homepage = "https://github.com/baguettejet/zenvision-studio"
Protocol = "https://github.com/baguettejet/zenvision-linux"

[tool.hatch.build.targets.wheel]
packages = ["zvstudio"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP031", "B027"]
