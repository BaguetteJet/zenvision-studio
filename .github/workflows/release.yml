name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .deb
        run: packaging/deb/build-deb.sh
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if ! git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "not on a tag — build finished, skipping release upload"
            exit 0
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/*.deb --clobber
          else
            gh release create "v${VERSION}" dist/*.deb --generate-notes
          fi